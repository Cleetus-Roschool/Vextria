/* Support header */
.support-header{
  width:850px;
  max-width:100%;
  height:69px;
  background:#CDCDCD;
  border-bottom:1px solid #fff;
  border-radius:4px 4px 0 0;

}
.support-header-logo{
  width:50px;
  height:50px;
  margin-left:20px;

}
.support-header-delimiter{
  width:2px;
  height:27px;

}
.support-header-title{

/* Support navbar */
.support-navbar{
  width:850px;
  max-width:100%;
  height:26px;
  background:#AAAAAA;
  border-radius:0 0 10px 10px;

  z-index:2;
}
.support-navbar-left{
  display:flex;
  align-items:center;

}
.support-navbar-right{

}
.support-navbar-lang{
  display:flex;
  align-items:center;
  gap:5px;
  color:#fff;
  font-size:11px;

  text-decoration:none;
  text-transform:uppercase;
}
.support-navbar-lang:hover{
  text-decoration:underline;
}
.support-navbar-lang .flag-icon{
  font-size:14px;
  line-height:1;
}
.support-nav-link{

  align-items:center;
  justify-content:center;
  height:26px;
  padding:0 12px;
  color:#fff;
  background:#AAAAAA;
  font-size:11px;
  font-weight:700;
  letter-spacing:0.3px;
  text-decoration:none;
  text-transform:uppercase;
}
.support-nav-link:hover{
  color:#fff;
  background:#D1D1D1;
}
.support-nav-link.active{
  color:#2a2a2a;
  background:#fff;

}
.support-frame-main{
  width:592px;
  max-width:100%;
}
.answers-box{

.answers-title{

}

}
.answers-search{

  height:36px;
  padding:0 10px 0 32px;
  border:1px solid #ccc;
  border-radius:2px;
  font-size:14px;
  box-sizing:border-box;
}

    background-image: -o-linear-gradient(top, white, #ebebeb);
    background-image: linear-gradient(to bottom, white, #ebebeb);

.button.primary:hover, .button.save:hover, .content a.button.primary:hover, .content a.button.save:hover,

.button:hover, .content a.button:hover, .button_disabled:hover {

    background-image: -ms-linear-gradient(top, #f7f7f7, #ebebeb);
    background-image: -o-linear-gradient(top, #f7f7f7, #ebebeb);

/* Recently updated frame */
.recent-box{
  width:592px;
  max-width:100%;
  background:#f4f4f4;
  margin:10px auto 0;
  padding:15px 23px;
  box-sizing:border-box;
}
.recent-item{
  width:546px;
  max-width:100%;
  min-height:65px;
  background:#fff;
  box-sizing:border-box;
  padding:14px;

}
.recent-item:last-child{

}
.recent-item-title{

}
.recent-item-meta{

}

/* Sidebar */

.faq-item{

}
.faq-item:last-child{

/* Section (topic list) page */

  width:850px;
  max-width:100%;
  background:#fff;

.section-breadcrumb{

.section-breadcrumb a{

.topic-table{

  border-top:1px solid #ddd;

.topic-header{

  font-size:12px;

.topic-header-title{

.topic-header-views{
  width:100px;
  text-align:center;
}
.topic-header-activity{
  width:160px;
  text-align:right;
}
.topic-row{

  padding:12px 14px;

.topic-row:hover{

}
.topic-title{

.topic-activity{

  font-size:13px;

</head>
