<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vextria - Parents (and Players) Respond</title>
<link rel="icon" type="image/png" href="https://github.com/Cleetus-Roschool/Vextria/blob/main/asdo.png?raw=true">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{
  background-color:#fff;
  color:#fff;
  overflow-x:hidden;
  font-size:95%;
}

/* Top banner */
.topbar{
  position:relative;
  margin-bottom:0;
  z-index:100;
  width:100%;
  background:#363636;
}
.classic-roblox-header{
  width:1000px;
  max-width:100%;
  height:76px;
  background:#363636;
  position:relative;
  z-index:100;
  margin:0 auto;
}
.classic-roblox-header-inner{
  max-width:none;
  width:100%;
  height:76px;
  margin:0 auto;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  padding:0 20px 0;
  position:relative;
  overflow:visible;
}
.classic-nav-links{
  display:flex;
  list-style:none;
  margin:0;
  padding:0;
  gap:0;
  align-items:flex-end;
  position:relative;
  overflow:visible;
}
.classic-nav-links > li{
  position:relative;
  display:flex;
  align-items:flex-end;
  overflow:visible;
}
.classic-nav-links a{
  color:#fff;
  text-decoration:none;
  font-size:14px;
  font-weight:700;
  letter-spacing:0.3px;
  display:flex;
  align-items:center;
  justify-content:center;
  width:auto;
  height:30px;
  padding:0 8px;
  margin:0;
  transition:background-color 0.1s ease;
  white-space:nowrap;
}
.classic-nav-links > li > a:hover,
.classic-nav-links > li.active > a{
  background:#000;
  color:#fff;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  align-self:center;
  text-decoration:none;
}
.brand-logo{
  display:block;width:188px;height:72px;
  background:url("https://github.com/Cleetus-Roschool/Vextria/blob/main/Your%20paragraph%20text.png?raw=true") center/contain no-repeat
}

/* Page Layout */
.page-container{
  max-width:1000px;margin:0 auto;min-height:calc(100vh - 114px);
  display:flex;color:#333;
}
.legal-content{
  flex-grow:1;padding:25px 30px;color:#222;
  font-size:14px;line-height:1.6;
}
.legal-content h1{
  font-size:40px;
  margin-top:0;
  margin-bottom:4px;
  color:#363636;
  font-weight:700;
}
.legal-content h2{
  font-size:16px;
  margin-top:24px;
  margin-bottom:8px;
  color:#000;
  font-weight:700;
}
.faq-main h2:first-child{
  margin-top:6px;
}
.legal-content p{margin:8px 0 15px 0;color:#000}

.back-link{
  display:inline-block;
  margin-bottom:18px;
  padding:0;
  border:none;
  color:#095FB4;
  font-weight:700;
  text-decoration:none;
  font-size:13px;
}
.back-link:hover{
  text-decoration:underline;
}

.faq-layout{
  display:flex;
  gap:25px;
  align-items:flex-start;
}
.faq-main{
  flex:1;
  min-width:0;
}
.faq-sidebar{
  flex:0 0 260px;
  background:#f2f2f2;
  border:1px solid #ccc;
  padding:15px;
  margin-top:-34px;
}
.faq-sidebar h2{
  margin-top:0;
  text-align:center;
  font-size:14px;
  font-weight:700;
}
.faq-sidebar ul{
  list-style:none;
  margin:0;
  padding:0;
}
.faq-sidebar li{
  margin-bottom:5px;
}
.faq-sidebar a{
  color:#095FB4;
  text-decoration:none;
  font-size:14px;
}
.faq-sidebar a:hover{text-decoration:underline}

.testimonial{
  margin:0 0 20px 0;
}
.testimonial-text{
  font-style:italic;
  margin:0 0 4px 0;
}
.testimonial-name{
  font-weight:700;
  margin:0 0 15px 0;
}

/* Footer */
.lower{
  width:100%;
  height:37px;
  min-height:37px;
  background:#363636;
  position:relative;
  z-index:10;
  padding:0 20px;
}
.footer-inner{
  max-width:1000px;
  height:37px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:13px;
  color:#fff;
}
.footer-inner .footer-brand{font-weight:400;color:#fff;text-decoration:none}
.footer-inner .footer-brand:hover{text-decoration:underline}
.footer-inner .footer-copyright{color:#cfe0f2}

@media(max-width:768px){
  .page-container{flex-direction:column}
  .faq-layout{flex-direction:column}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="classic-roblox-header">
    <div class="classic-roblox-header-inner">
      <span class="brand" aria-label="Vextria">
        <span class="brand-logo"></span>
      </span>
      <ul class="classic-nav-links">
        <li><a href="https://cleetus-roschool.github.io/Vextria/info/about-us">ABOUT US</a></li>
        <li><a href="https://cleetus-roschool.github.io/Vextria/info/careers">CAREERS</a></li>
        <li><a href="https://cleetus-roschool.github.io/Vextria/blog/home">BLOG</a></li>
        <li class="active"><a href="https://cleetus-roschool.github.io/Vextria/info/parents">PARENTS</a></li>
        <li><a href="https://cleetus-roschool.github.io/Vextria/contact-us">CONTACT US</a></li>
      </ul>
    </div>
  </div>
</header>

<div class="page-container">
  <main class="legal-content">
    <h1>Parents (and Players) Respond</h1>
    <a class="back-link" href="/Vextria/info/parents">&lt; Back to Parents</a>

    <div class="faq-main">
      <h2>What Parents Are Saying</h2>
      <div class="testimonial">
        <p class="testimonial-text">Text</p>
        <p class="testimonial-name">- Name</p>
      </div>

      <h2>What Players Are Saying</h2>
      <div class="testimonial">
        <p class="testimonial-text">Text</p>
        <p class="testimonial-name">- Name</p>
      </div>
    </div>
  </main>
</div>

<footer class="lower">
  <div class="footer-inner">
    <a class="footer-brand" href="/Vextria/"><strong style="font-weight:900">VEXTRIA</strong>.com</a>
    <span class="footer-copyright">©2026 Vextria Group</span>
  </div>
</footer>

</body>
</html>
